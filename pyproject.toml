[project]
name = "splet"
version = "0.1.0"
description = "Multilayer knowledge graph of a software project (structure, history, docs) with an MCP server and Obsidian export"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["knowledge graph", "mining software repositories", "change coupling",
            "personalized pagerank", "model context protocol", "obsidian"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
authors = [
    { name = "Strahinja Janjic", email = "strahinja.janjic@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "igraph>=1.0.0",
    "leidenalg>=0.12.0",
    "mcp>=2.2",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
]

[project.scripts]
splet = "splet.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "mypy>=2.3.1",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "scikit-learn>=1.9.1",
    "scipy-stubs>=1.18.1.1",
    "tiktoken>=0.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = ["PLR2004", "PLR0913", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src/splet"]

[[tool.mypy.overrides]]
module = ["igraph", "leidenalg", "networkx", "networkx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["splet"]
branch = true
